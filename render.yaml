services:
  - type: web
    name: integrity-mesh-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: integrity-mesh-db
          property: connectionString
      - key: INTEGRITY_ALLOWED_ORIGINS
        value: "*"
      - key: INTEGRITY_AI_PROVIDER
        value: groq
      - key: INTEGRITY_AI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: INTEGRITY_GROQ_ENGINEERING_MODEL
        value: llama-3.3-70b-versatile
      - key: INTEGRITY_GROQ_RESEARCH_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_API_KEY
        sync: false
databases:
  - name: integrity-mesh-db
    plan: free
